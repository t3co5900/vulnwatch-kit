name: Alertas por Telegram

on:
  schedule:
    - cron: "17 */3 * * *"   # cada 3 horas
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vulnwatch-state

jobs:
  alert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Buscar y avisar
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m vulnwatch alert
      - name: Guardar estado
        run: |
          git config user.name "vulnwatch-bot"
          git config user.email "vulnwatch-bot@users.noreply.github.com"
          git add state
          git diff --cached --quiet || (git commit -m "chore: actualizar estado" && git push)
